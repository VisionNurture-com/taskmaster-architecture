name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 公開用リポジトリでのみ走る。コミットの author / committer が公開用 identity かを見る。
  identity:
    name: commit identity
    if: github.repository_owner == 'VisionNurture-com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 公開用 identity 以外のコミットが無いことを確かめる
        run: |
          set -euo pipefail
          expected='TechBizPlusD <blog@techbizplusd.com>'
          bad="$(git log --format='%H%x09%an <%ae>%x09%cn <%ce>' \
                 | awk -F'\t' -v e="$expected" '$2 != e || $3 != e')"
          if [ -n "$bad" ]; then
            echo "::error::公開用 identity 以外のコミットがあります（期待: $expected）"
            echo "$bad"
            exit 1
          fi
          echo "全コミットが $expected です"

  test:
    name: 全プロジェクトのテスト（presentation の統合テストは Docker を使う）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: テストを実行する
        run: ./gradlew test --console=plain
      - name: Spring Modulith のサンプル（modulith/）のテストを実行する
        run: ./gradlew -p modulith test --console=plain
